# Junior iOS uygulamasini Mac olmadan derler.
# Cikti imzasiz bir .ipa'dir; imzalama telefonda SideStore/AltStore tarafindan yapilir.
name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

# Ayni dal icin eski derlemeyi iptal et; private repoda macOS dakikalari 10x sayilir.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # DAT iOS SDK Xcode 26.4+ istiyor; macos-15'te varsayilan 16.4.
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Xcode surumunu yazdir
        run: xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Proje dosyasini uret
        working-directory: ios
        run: xcodegen generate --spec project.yml

      # RegistrationState ve PermissionStatus enum'lari belgelerde yok ve
      # String(describing:) yalniz rawValue basiyor. SDK arayuzunden okuyalim.
      - name: DAT enum tanimlari
        working-directory: ios
        continue-on-error: true
        run: |
          xcodebuild -project Junior.xcodeproj -scheme Junior             -destination "generic/platform=iOS"             -clonedSourcePackagesDirPath SourcePackages             -resolvePackageDependencies >/dev/null 2>&1 || true
          echo "===== RegistrationState / PermissionStatus ====="
          grep -rhA 12 "enum RegistrationState\|struct RegistrationState\|enum PermissionStatus\|struct PermissionStatus"             SourcePackages --include=*.swiftinterface --include=*.h 2>/dev/null | head -60 || echo "bulunamadi"
          echo "===== Oturum durumu ve kamera imzalari ====="
          grep -rhA 10 -E "enum [A-Za-z]*SessionState|enum [A-Za-z]*StreamState"             SourcePackages --include=*.swiftinterface 2>/dev/null | head -40 || true
          grep -rhE "func (capturePhoto|stateStream|devicesStream|addCamera|removeCamera)"             SourcePackages --include=*.swiftinterface 2>/dev/null | sort -u | head -20 || true
          echo "===== Isik / gosterge / dokunus API'si ====="
          grep -rhoE "(func|var|case) [A-Za-z]*(Led|LED|Light|Indicator|Haptic|Vibrat)[A-Za-z]*"             SourcePackages --include=*.swiftinterface 2>/dev/null | sort -u | head -20 || echo "yok"

      # Testler once: gecmezse .ipa uretilmesin.
      - name: Birim testleri (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)['devices'].items()):
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      print(device['name'] + '|' + device['udid'])
                      raise SystemExit
          ")
          test -n "$DEVICE" || { echo "Kullanilabilir iPhone simulatoru yok"; exit 1; }
          echo "Simulator: $DEVICE"
          # Ayni ad birden cok iOS surumunde olabiliyor; kimlikle secilir.
          UDID="${DEVICE#*|}"
          echo "$UDID" > .sim_udid
          # Paralel test, bu boyuttaki bir takim icin simulator klonlari acip
          # dakikalar harciyor; testler kendisi iki saniye suruyor.
          #
          # Cikti dosyaya yaziliyor: "-quiet | tail" birlesimi derleme hatasini
          # yutup geriye yalniz uyarilari birakiyordu, sebep gorunmuyordu.
          set +e
          xcodebuild test \
            -project Junior.xcodeproj \
            -scheme Junior \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath DerivedSim \
            -clonedSourcePackagesDirPath SourcePackages \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo "===== HATALAR ====="
            grep -E "error:|BUILD FAILED|Testing failed|xcodebuild: error" test.log | head -40 || true
            echo "===== SON 60 SATIR ====="
            tail -60 test.log
            exit $status
          fi
          grep -E "Executed [0-9]+ tests" test.log | tail -1 || true

      # Arayuz Mac olmadan da gorulsun: ornek ekranlar (DemoMode, yalniz Debug
      # derlemesinde) simulatorde acilip fotograflanir. Basarisiz olursa .ipa
      # yine uretilir.
      - name: Ekran goruntuleri (simulator)
        working-directory: ios
        continue-on-error: true
        run: |
          UDID="$(cat .sim_udid)"
          APP="DerivedSim/Build/Products/Debug-iphonesimulator/Junior.app"
          test -d "$APP" || { echo "Simulator uygulamasi yok"; exit 1; }
          # Testler uygulamayi normal acip izin sordurdu; o pencere simulatorde
          # kaliyor ve her goruntuyu kapatiyordu. Temiz bir simulatorle baslanir.
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          # Ilk acilista sistem bildirimleri (Apple Intelligence vb.) ekrani kapatiyor.
          sleep 25
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged \
            --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          for scene in empty chat listening settings live; do
            xcrun simctl terminate "$UDID" xyz.jrbilge.junior 2>/dev/null || true
            xcrun simctl launch "$UDID" xyz.jrbilge.junior -JuniorDemo "$scene"
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$scene.png"
          done
          ls -l shots
          echo "===== Cokme raporlari ====="
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5 || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Junior* 2>/dev/null | head -1); do
            grep -oE '"(symbol|exception|type|signal|termination)"[^,]*' "$f" | head -40 || true
          done

      - name: Ekran goruntulerini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Junior-screens
          path: ios/shots
          retention-days: 14
          if-no-files-found: ignore

      - name: Derle (imzasiz)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Junior.xcodeproj \
            -scheme Junior \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build

      - name: .ipa paketle
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/Junior.app"
          test -d "$APP" || { echo "Junior.app bulunamadi"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/Junior.app
          zip -qry Junior.ipa Payload
          ls -lh Junior.ipa

      - name: Ciktilari yukle
        uses: actions/upload-artifact@v4
        with:
          name: Junior-ipa
          path: ios/Junior.ipa
          retention-days: 30
          if-no-files-found: error
