name: Junior
options:
  bundleIdPrefix: xyz.jrbilge
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "13"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.0

targets:
  Junior:
    type: application
    platform: iOS
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      # Dynamic Island / kilit ekranı (Live Activity) eklentisi uygulamaya gömülür.
      - target: JuniorWidgets
    sources:
      - path: Junior/Sources
      - path: Junior/Resources
      # Live Activity modeli ve noktalı kedi: uygulama ve widget eklentisi paylaşır.
      - path: Shared
    info:
      path: Junior/Info.plist
      properties:
        CFBundleDisplayName: Junior
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Dynamic Island / kilit ekranında Live Activity.
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Izin metinleri kullaniciya aynen gosterilir; Turkce ve acik olmali.
        NSMicrophoneUsageDescription: "Junior'a konuşabilmen için ve 'Telefonda sürekli dinle' açıkken konuşmaları kaydedip kendi bilgisayarına yüklemek için mikrofon gerekiyor."
        NSSpeechRecognitionUsageDescription: Soylediklerini yaziya cevirmek icin konusma tanima gerekiyor.
        NSCameraUsageDescription: "\"Bu ne\" gibi sorularda gonderdigin fotografi cekmek icin kamera gerekiyor."
        NSPhotoLibraryUsageDescription: Var olan bir fotografi Junior'a sormak icin galeri erisimi gerekiyor.
        NSPhotoLibraryAddUsageDescription: Junior'in bilgisayarda kurguladigi videoyu Fotograflar'a kaydetmek icin gerekiyor.
        # Telefon eylemleri: "annemi ara", "yarın 9'a hatırlat", "takvime ekle", "Apple Müzik'te çal".
        NSContactsUsageDescription: "\"Ali'yi ara\" gibi isteklerde kişiyi rehberinde bulmak için gerekiyor."
        NSRemindersFullAccessUsageDescription: Hatırlatıcı eklemek için Hatırlatıcılar erişimi gerekiyor.
        NSRemindersUsageDescription: Hatırlatıcı eklemek için Hatırlatıcılar erişimi gerekiyor.
        NSCalendarsFullAccessUsageDescription: Takvime etkinlik eklemek için Takvim erişimi gerekiyor.
        NSCalendarsUsageDescription: Takvime etkinlik eklemek için Takvim erişimi gerekiyor.
        NSAppleMusicUsageDescription: Apple Müzik kitaplığındaki şarkıları çalmak için gerekiyor.
        # Kurgulanan videolar Dosyalar uygulamasinda da gorunsun (Junior klasoru).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Yerel aglarda kendi sunucuna duz HTTP ile baglanabilmek icin; uzak adres HTTPS'tir.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Uyandirma sozcugu arka planda da dinleyebilsin. iOS yine de uygulamayi
        # uyutabilir; kilitli telefonda surekli calisma garantisi yoktur.
        UIBackgroundModes:
          - audio
          # Meta DAT'in arka planda kamera/oturum islerini surdurebilmesi (Codex'in duzeltmesi).
          - processing
          # DAT gozlukle Bluetooth ve harici aksesuar kanallarindan konusuyor.
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
        NSBluetoothAlwaysUsageDescription: Gozlukle baglanti kurmak icin Bluetooth gerekiyor.
        NSBluetoothPeripheralUsageDescription: Gozlukle baglanti kurmak icin Bluetooth gerekiyor.
        NSLocalNetworkUsageDescription: Gozluk baglantisi yerel agi kullaniyor.
        NSBonjourServices:
          - _bonjour._tcp
        # Kayit sirasinda Meta AI uygulamasini acabilmek icin sema sorgusu gerekli.
        LSApplicationQueriesSchemes:
          - fb-viewapp
          # Telefon eylemleri: Spotify yuklu mu, WhatsApp acilabilir mi diye bakmak icin.
          - spotify
          - whatsapp
        # Gozluk harici aksesuar protokolu uzerinden veri tasiyor.
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        # Meta AI uygulamasi kayit sonrasi buraya geri doner.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - junior
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleTypeRole: Editor
        MWDAT:
          AppLinkURLScheme: junior://
          # Developer Mode'da dogrulama (attestation) yapilmiyor ve resmi ornek
          # bu alani "0" olarak veriyor. Bos string birakmak Meta AI tarafinda
          # "dahili hata / islem tamamlanamadi" ile sonuclaniyordu.
          #
          # ClientToken ve TeamID bilerek yok: resmi ornekte de yoklar ve bos
          # string olarak yazildiklarinda ayni dogrulama hatasini uretiyorlar.
          # Yayimlanmis bir uygulama icin Wearables Developer Center'dan alinir.
          MetaAppID: "0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.jrbilge.junior
        TARGETED_DEVICE_FAMILY: "1"

  JuniorWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: JuniorWidgets
      - path: Shared
    info:
      path: JuniorWidgets/Info.plist
      properties:
        CFBundleDisplayName: Junior
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.jrbilge.junior.widgets
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES

  JuniorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JuniorTests
    dependencies:
      - target: Junior
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.jrbilge.junior.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Junior:
    build:
      targets:
        Junior: all
        JuniorTests: [test]
    test:
      targets:
        - JuniorTests
    run:
      config: Debug
